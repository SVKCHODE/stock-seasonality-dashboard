name: Refresh Nifty 500 monthly data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 2 * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh Upstox monthly history
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          HISTORY_YEARS: 10
        run: node scripts/refresh-data.mjs
      - name: Commit refreshed dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monthly_prices.json data/refresh-errors.json
          git diff --cached --quiet || git commit -m 'Refresh Nifty 500 monthly market data'
          git push
